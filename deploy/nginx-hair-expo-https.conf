# Use this configuration after the Let's Encrypt certificate exists.
# The certificate covers both checkout.guangzhouhairexpo.asia and api.guangzhouhairexpo.asia.

limit_req_zone $binary_remote_addr zone=hair_expo_passcode:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name checkout.guangzhouhairexpo.asia api.guangzhouhairexpo.asia;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name checkout.guangzhouhairexpo.asia;

    ssl_certificate /etc/letsencrypt/live/checkout.guangzhouhairexpo.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/checkout.guangzhouhairexpo.asia/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:4421;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.guangzhouhairexpo.asia;

    client_max_body_size 1m;
    ssl_certificate /etc/letsencrypt/live/checkout.guangzhouhairexpo.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/checkout.guangzhouhairexpo.asia/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /auth/unlock {
        limit_req zone=hair_expo_passcode burst=5 nodelay;
        proxy_pass http://127.0.0.1:4423;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4423;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
