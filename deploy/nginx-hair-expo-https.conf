# Use this configuration after the Let's Encrypt certificate exists.
# The certificate covers both checkout.guangzhouhairexpo.asia and api.guangzhouhairexpo.asia.
map $http_origin $cors_origin {
    default                                     "";
    "https://checkout.guangzhouhairexpo.asia"   $http_origin;
}

map $http_access_control_request_headers $cors_allow_headers {
    default  "Authorization, Content-Type, X-Requested-With, Idempotency-Key";
    "~."     $http_access_control_request_headers;
}


limit_req_zone $binary_remote_addr zone=hair_expo_passcode:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name checkout.guangzhouhairexpo.asia api.guangzhouhairexpo.asia;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name checkout.guangzhouhairexpo.asia;

    ssl_certificate /etc/letsencrypt/live/checkout.guangzhouhairexpo.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/checkout.guangzhouhairexpo.asia/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:4421;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.guangzhouhairexpo.asia;

    client_max_body_size 1m;
    ssl_certificate /etc/letsencrypt/live/api.guangzhouhairexpo.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.guangzhouhairexpo.asia/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /auth/unlock {
        limit_req zone=hair_expo_passcode burst=5 nodelay;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers     $cors_allow_headers always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age           86400 always;
            add_header Content-Length 0;
            add_header Content-Type   text/plain;
            return 204;
        }
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary                             Origin always;

        proxy_pass http://127.0.0.1:4423;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers     $cors_allow_headers always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age           86400 always;
            add_header Content-Length 0;
            add_header Content-Type   text/plain;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;

        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary                             Origin always;

        proxy_pass http://127.0.0.1:4423;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}