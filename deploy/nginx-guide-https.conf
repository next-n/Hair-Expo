# Public project guide reverse proxy.
# Include this file from Nginx's http configuration directory after the
# Let's Encrypt certificate for guide.guangzhouhairexpo.asia exists.

limit_req_zone $binary_remote_addr zone=hair_expo_guide_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=hair_expo_guide_connections:10m;
proxy_cache_path /var/cache/nginx/hair_expo_guide levels=1:2 keys_zone=hair_expo_guide:10m max_size=100m inactive=10m use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name guide.guangzhouhairexpo.asia;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name guide.guangzhouhairexpo.asia;

    ssl_certificate /etc/letsencrypt/live/guide.guangzhouhairexpo.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guide.guangzhouhairexpo.asia/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    limit_req zone=hair_expo_guide_requests burst=20 nodelay;
    limit_conn hair_expo_guide_connections 20;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = / {
        proxy_pass http://127.0.0.1:4421/guide;
        proxy_cache hair_expo_guide;
        proxy_cache_methods GET HEAD;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_valid 200 10m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /guide {
        proxy_pass http://127.0.0.1:4421;
        proxy_cache hair_expo_guide;
        proxy_cache_methods GET HEAD;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_valid 200 10m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:4421;
        proxy_cache hair_expo_guide;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 1d;
        expires 1d;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        return 404;
    }
}
