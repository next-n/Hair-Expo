services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file:
      - /etc/hair-expo/backend.env
    environment:
      NODE_ENV: production
      PORT: 4423
      DATABASE_PATH: /app/data/hair-expo.sqlite
      CATALOG_CSV_PATH: /app/catalog/trunov_price_list.csv
    ports:
      - "127.0.0.1:4423:4423"
    volumes:
      - /var/lib/hair-expo:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4423/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        NEXT_PUBLIC_INVOICE_COMPANY_NAME: ${NEXT_PUBLIC_INVOICE_COMPANY_NAME}
        NEXT_PUBLIC_INVOICE_COMPANY_DETAILS: ${NEXT_PUBLIC_INVOICE_COMPANY_DETAILS}
    env_file:
      - /etc/hair-expo/frontend.env
    environment:
      NODE_ENV: production
      PORT: 4421
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:4421:4421"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
